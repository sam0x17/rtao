documentation = "https://docs.rs/rtao-upstream-fips204"
readme = "README.md"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "fips204"
path = "src/lib.rs"
test = false
doctest = false
bench = false

[dependencies]
