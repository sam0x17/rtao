[package]
name = "rtao-upstream-fips204"
version = "0.490.0"
edition = "2021"
rust-version = "1.70"
authors = ["Eric Schorn <eschorn@integritychain.com>"]
description = "Unofficial republish of fips204 from RaoFoundation/subtensor v490 (vendored from integritychain/fips204), for rtao; not affiliated with or endorsed by its authors."
license = "MIT OR Apache-2.0"
