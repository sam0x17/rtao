[package]
name = "rtao-upstream-w3f-bls"
version = "0.490.0"
edition = "2018"
authors = ["Jack Grigg <str4d@i2pmail.org>", "Jeff Burdges <burdges@gnunet.org>", "Syed Hosseini <syed@riseup.net>"]
description = "Unofficial republish of w3f-bls from RaoFoundation/subtensor v490 (vendored from w3f/bls), for rtao; not affiliated with or endorsed by its authors."
license = "MIT OR Apache-2.0"
repository = "https://github.com/sam0x17/rtao"
homepage = "https://github.com/RaoFoundation/subtensor"
documentation = "https://docs.rs/rtao-upstream-w3f-bls"
readme = "README.md"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "w3f_bls"
path = "src/lib.rs"
test = false
doctest = false
bench = false

[dependencies]
arrayref = { version = "0.3", default-features = false }
rand = { version = "0.8.5", default-features = false }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
sha3 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
digest = { version = "0.10", default-features = false }
ark-ff = { version = "0.4.0", default-features = false }
ark-ec = { version = "0.4.0", default-features = false }
ark-serialize = { version = "0.4.0", default-features = false, features = ["derive"] }
ark-serialize-derive = { version = "0.4.0", default-features = false }
ark-bls12-381 = { version = "0.4.0", default-features = false, features = ["curve"] }
ark-bls12-377 = { version = "0.4.0", default-features = false, features = ["curve"] }
zeroize = { version = "1.0", default-features = false, features = ["zeroize_derive"] }

[features]
default = ["std"]
std = ["rand/std"]
experimental = []

[lints.rust]
deprecated = "allow"
unused = "allow"
unexpected_cfgs = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }

[lints.rustdoc]
all = { level = "allow", priority = -1 }
