# Generated by `cargo xtask forks` from sdk/bittensor-core/Cargo.toml at
# https://github.com/sam0x17/subtensor.git d7fd8762625a93b9837cde28d496b0819a976f0e.
# Do not edit: see MODIFICATIONS for every difference from that file.

[package]
name = "rtao-upstream-core"
version = "0.490.0"
edition = "2021"
description = "Unofficial republish of bittensor-core from RaoFoundation/subtensor v490 with rtao's reviewed core patch (the Ed25519 erasure repair and the injectable Ledger transport), for rtao; not affiliated with or endorsed by its authors."
license = "Apache-2.0"
repository = "https://github.com/sam0x17/rtao"
homepage = "https://github.com/RaoFoundation/subtensor"
documentation = "https://docs.rs/rtao-upstream-core"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "bittensor_core"
path = "src/lib.rs"
crate-type = ["rlib"]
test = false
doctest = false
bench = false

[dependencies]
ansible-vault = { version = "0.2.1", optional = true }
base64 = { version = "0.22.1" }
bip39 = { version = "2.0", default-features = false, features = ["std", "rand"] }
ed25519-zebra = { version = "4.0", default-features = false }
fernet = { version = "=0.2.1", optional = true }
openssl = { version = "0.10", optional = true, features = ["vendored"] }
hex = { version = "0.4.3" }
hkdf = { version = "0.12.4" }
subtensor-hashed = { package = "rtao-upstream-hashed", version = "=0.490.0", path = "../hashed", default-features = false, features = ["signing"] }
libloading = { version = "0.8.9", optional = true }
pbkdf2 = { version = "0.12.2", optional = true }
schnorrkel = { version = "0.11.5" }
scrypt = { version = "0.11.0", optional = true }
serde = { version = "1.0.132", features = ["derive"] }
serde_json = { version = "1.0.132", features = ["arbitrary_precision"] }
sha2 = { version = "0.10.8" }
sodiumoxide = { version = "0.2", default-features = false, optional = true, features = ["std"] }
sp-core = { version = "37.0.0", default-features = false, features = ["full_crypto", "serde"] }
zeroize = { version = "1" }
ark-serialize = { version = "0.4.0", default-features = false, features = ["derive"] }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive", "max-encoded-len"] }
rand_core = { version = "0.6.4" }
reqwest = { version = "0.12.15", default-features = false, optional = true, features = ["blocking", "json", "rustls-tls-native-roots"] }
tle = { package = "rtao-upstream-tle", version = "=0.490.0", path = "../tle", default-features = false, features = ["std"] }
w3f-bls = { package = "rtao-upstream-w3f-bls", version = "=0.490.0", path = "../w3f-bls", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10" }
ml-kem = { version = "0.2.1" }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash64"] }
frame-metadata = { version = "23.0.0", default-features = false, features = ["current", "decode", "std"] }
merkleized-metadata = { version = "0.5.1" }
rayon = { version = "1.10", optional = true }
scale-info = { version = "2.11.2", default-features = false, features = ["std", "serde"] }
subtensor-macros = { package = "rtao-upstream-macros", version = "=0.490.0", path = "../macros", default-features = false }
ledger-apdu = { version = "0.11", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.6", default-features = false, optional = true, features = ["linux-native-basic-udev"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2.6.6", default-features = false, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-time = { version = "1" }

[features]
default = ["host"]
host = ["dep:ansible-vault", "dep:fernet", "dep:libloading", "dep:openssl", "dep:pbkdf2", "dep:rayon", "dep:reqwest", "dep:scrypt", "dep:sodiumoxide", "sp-core/std", "subtensor-hashed/std"]
ledger = ["dep:ledger-apdu", "dep:hidapi"]

[lints.rust]
deprecated = "allow"
unused = "allow"
unexpected_cfgs = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }

[lints.rustdoc]
all = { level = "allow", priority = -1 }
