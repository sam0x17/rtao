notes = "Added by the v488 runtime adoption (D-128). Ported 2026-11-08 (D-151): registration targets from the wallet's public descriptors (KeyView::authority_descriptor) checked against their accounts; finalized registration skips keys already registered; the payer may not be an unregistered wallet key and must itself be registered if rotating; the scheme must be enabled and MEV Shield available; classical registrations go one per transaction, post-quantum ones together, each under check_registration_deposit at the per-account ceiling; fees are the inner plus carrier quotes priced with the payer's scheme; an allowance and/or callback must approve; the payer must hold the reserve, fees and retained balance; submission is Executor::submit_call_dyn with shielded=true and finalization, each registration then verified in finalized state. Errors keep the receipt and quote (WalletRegistrationError, Python's message prefix). Tests cover the refusals and skips, not a live shielded submission."

