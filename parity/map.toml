notes = "Added by the v488 runtime adoption (D-128). Ported 2026-11-08 (D-151): PreparedPqExtrinsic carries the complete native payload and the authority snapshot, validates as Python's validate, exports and parses Python's to_dict/from_dict layout (format, unsigned, authority; the 17 unsigned fields with payload_json {format}); sign_prepared_pq rebuilds the extension bytes from trusted metadata and the reviewed fields before using the key, refuses another chain, wallet or commitment; Client::submit_pq_proof rechecks the current finalized authority (rotating: unchanged generation, commitment and nonce; standard: nonce not consumed), the runtime and the payload, verifies the proof against the request's authority and submits. The generic pq names are the only Rust names (prepare_pq_call carries the mldsa alias). Metadata-hash requests are not produced (metadata_hash is always null, as Python's default)."

