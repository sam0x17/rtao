 there through Client::at_receipt, so a lagging read endpoint falls back to the submission endpoint. It compares it in exact parts with the vector the extrinsic applied (its SubnetEmissionWeightsSet event, falling back to the previewed vector) and reports a base change before submission (base_changed) apart from a concurrent change. New exit condition: exit 1 when the vector stored at the finalized inclusion block differs from the applied one; the receipt is retained. A saved multisig approval of threshold >= 2 that did not execute, a block not finalized within the bound, or a read error skips the read-back with a reason and keeps exit 0; a saved threshold-1 multisig counts as executed, as in proxy kill. JSON shape: --json writes the receipt document unchanged, then a second {\"readback\": {...}} document (status match|mismatch|skipped); it stays a separate document because the receipt must reach the user before the bounded finality wait. subnet_emission_commands write tests and the module unit tests pin this behaviour; no Python oracle covers it. v488 port 2026-11-07: set takes --burn/--recycle (default 0) and checks all five shares sum to 100%; set-value/increase/decrease accept every slot; show lists burn and recycle with their range and the burn+recycle cap; a burn+recycle violation names that cap. The rtao read-back lists every slot. Inventory hash refreshed. v490 port 2026-11-11 (D-178): show reports gamma_share, set counts the gamma shares in the sum (with and_gamma in the error), set-value/increase/decrease renormalize with them; help and hints say the other slots fill the rest. Tests: gamma_shares_count_in_the_sum (rtao-cli tests/subnet_emission_commands.rs)."

