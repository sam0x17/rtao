[[divergences]]
id = "D-076"
upstream_symbol = "bittensor.executor subnet registration completion failures"
python_behavior = "Raises completion failures after the registration submission without a typed error carrier retaining its included receipt."
rtao_behavior = "Returns TxError::PostSubmission with the original observed receipt and primary cause when post-inclusion registration origin resolution or following fails. CLI direct and saved paths save that receipt once before releasing the signer, retain recovery identity and suppress generic connection retry framing. The error remains a failure; no NetworkAdded or completed registration is fabricated and no transaction is retransmitted."
rationale = "A failed completion read, timeout or connection close cannot erase an already observed mutation. Callers need its evidence before making any retry decision."
decision = "PLAN.md execution rule 5 recovery correction; registration completion and real SDK/CLI error paths independently reviewed on 2026-10-16"
