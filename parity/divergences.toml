id = "D-041"
upstream_symbol = "bittensor.cli.call / AppContext saved semantic multisig approval rounds / cli.multisig_helpers.await_pending_visible"
python_behavior = "Automatic later approvals poll briefly for pending visibility, then infer the opening from current pending state. If another signer completes or cancels the operation, a later approval can encode no timepoint and open another operation for the same call hash."
rtao_behavior = "Automatic later raw and saved semantic approvals retain the first submitted inner call and authenticate its opening from an included matching approval event. A pinned pending lookup refuses absent, replaced or already-approved state and composes Some(expected), preserving the original opening after later state removal. Saved semantic approval options disable owner-rate replanning; the executor also excludes multisig dispatch wrappers from automatic owner retries and returns the included failed receipt."
rationale = "A successful earlier approval does not authorize opening another operation after the first one disappears. The final approval consumes pending state even when its inner owner call fails, so an automatic owner retry can also create a new opening. Require explicit operator action for another operation while preserving the original receipt and recovery identity. NewMultisig receipt-height inference assumes the reviewed runtime uses BlockNumberProvider = System; the separate automated source guard is not adopted."
