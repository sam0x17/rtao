[[divergences]]
id = "D-036"
upstream_symbol = "bittensor.sp_core.Keypair secret constructors and wallets keyfile JSON errors"
python_behavior = "Malformed URI diagnostics can contain the full recovery phrase and derivation password; keyfile errors can expose other supplied secret strings or input key names."
rtao_behavior = "Signer, wallet and staged keyfile constructor errors retain fixed categories and messages, with owned dependency diagnostics wiped before disposal. Their returned Display, Debug and source chains exclude supplied secrets; direct upstream core primitives retain upstream behavior."
class = "stricter"
rationale = "Ordinary construction errors can be logged or displayed. Prevent secret-bearing dependency diagnostics from crossing the SDK error boundary while preserving pinned derivation and valid keyfile behavior."
decision = "PLAN.md execution rule 5; M2-S01 and M2-S03 (2026-10-14)"
pinning_tests = [
  "rtao_core_ext::keyfile_json::tests::wipes_every_owned_core_error_message_before_discarding_it",
