[[divergences]]
id = "D-042"
upstream_symbol = "bittensor.config readers / cli.call raw JSON / cli.commands.weights input / cli.commands.timelock / wallet message hex and transfer history / AppContext saved multisig reference resolution / cli.call_names recursive JSON traversal"
python_behavior = "Book/config and weights readers acquire complete selected files, and raw-call JSON uses an unbounded file reader. Saved multisig resolution detects cycles, but these inputs and acyclic/programmatic nested call/name inputs have no matching 16 MiB and 128-level input-budget policy."
rtao_behavior = "CLI books, raw-call JSON, aggregate weights input and shared config/cache reads refuse content over 16 MiB. File acquisition uses nonblocking regular descriptors and a growth-safe capped read; rejected config/cache inputs are neither quarantined nor overwritten. Inline inputs have the same byte budget. Timelock acquisition is bounded to 16 MiB; encryption caps plaintext at 8 MiB minus 1025 bytes and actual envelopes at 8 MiB minus one byte so emitted prefixed hex fits that input budget. Large decoding and file acquisition run off async workers, and plaintext is omitted from replay history. Saved multisig references allow chains through 128 entries and refuse deeper paths, including paths through cached descendants. Programmatic name-resolution JSON counts containers including the root argument map and refuses beyond 128; direct raw-call conversion separately refuses recursion depth 128 before runtime encoding."
rationale = "Bound memory and recursion for local untrusted inputs while preserving account selection. An oversized valid contact book must not become an empty book and redirect a same-name reference to a wallet. Finite acyclic reference chains and programmatic Values need explicit limits even when cycle detection and text-parser nesting checks are present. M8 also bounds wallet signature/ciphertext hex at 32 MiB and transfer-history responses at 16 MiB, 128 pages and 30 seconds total; history follows only HTTPS pagination on the expected endpoint and refuses cycles."
decision = "PLAN.md execution rule 5; safe input-budget policy registered during CLI source adoption (2026-10-15)"
