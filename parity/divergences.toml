[[divergences]]
id = "D-046"
upstream_symbol = "bittensor.intents.crowdloan.CreateCrowdloan.call / proxy.ExecuteProxyAnnounced.inner_args / batch.Batch.intents"
python_behavior = "Recursively constructs supplied nested intent dictionaries without matching depth, node-count or encoded-byte budgets."
rtao_behavior = "Checks the nested call iteratively before tool deserialization, recursive cloning or nested construction. Refuses more than 128 JSON levels, 1,048,576 values or 64 MiB of encoded JSON. The node count and encoded size, each multiplied by maximum levels, must also fit those budgets to bound retained subtree copies. Rejects serde private RawValue/Number carrier keys before they can introduce unscanned JSON."
rationale = "Bound untrusted programmatic inputs before recursive work. Count escaped serialized bytes without allocating another document, and preserve the original public origin and pinned view for accepted nested calls."
decision = "PLAN.md execution rule 5; bounded client input policy during M5-02 (2026-10-15)"
status = "active"
class = "stricter"
milestone = "M5"
pinning_tests = [
  "rtao_intents::crowdloan::tests::programmatic_nested_json_has_depth_node_and_encoded_byte_budgets",
  "rtao_intents::crowdloan::tests::tool_constructor_bounds_nested_call_before_serde_conversion",
  "rtao_intents::crowdloan::tests::recursive_work_budget_refuses_inputs_that_fit_literal_limits",
  "rtao_intents::proxy::tests::announced_proxy_refusals_preserve_nested_error_order_and_never_read",
  "rtao_intents::batch::tests::batch_constructor_and_programmatic_guards_reject_private_carriers_and_depth",
]
upstream_report = "Local input-budget policy; no upstream issue or PR filed. Named fixture source is present; hosted execution and acceptance remain pending."
upstream_link = "https://github.com/RaoFoundation/subtensor/blob/850f2755bb05a3851f948489f0ab27b0645cebce/sdk/python/bittensor/intents/crowdloan.py"

