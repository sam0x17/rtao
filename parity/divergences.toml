id = "D-042"
upstream_symbol = "bittensor.config readers / cli.call raw JSON / cli.commands.weights input / cli.commands.timelock / cli.upgrade_helpers local artifacts / wallet message hex and transfer history / AppContext saved multisig reference resolution / cli.call_names recursive JSON traversal / cli.commands.root allocate/swap and generated transaction Money input"
python_behavior = "Book/config, weights and local runtime-upgrade artifact readers acquire complete selected files, and raw-call JSON uses an unbounded file reader. Saved multisig resolution detects cycles, but these inputs and acyclic/programmatic nested call/name inputs have no matching byte and 128-level input-budget policy. Root allocation/swap and generated transaction Money fields accept Decimal text without the native 4096-byte and exponent-magnitude normalization budgets."
rtao_behavior = "CLI books, raw-call JSON, aggregate weights input and shared config/cache reads refuse content over 16 MiB. Local runtime-upgrade call/WASM/manifest assets use a separate 64 MiB cap. File acquisition uses nonblocking regular descriptors and a growth-safe capped read; rejected config/cache inputs are neither quarantined nor overwritten, and regular symlink targets remain supported. Inline inputs have the same byte budget. Timelock acquisition is bounded to 16 MiB; encryption caps plaintext at 8 MiB minus 1025 bytes and actual envelopes at 8 MiB minus one byte so emitted prefixed hex fits that input budget. Large decoding and file acquisition run off async workers, and plaintext is omitted from replay history. Saved multisig references allow chains through 128 entries and refuse deeper paths, including paths through cached descendants. Programmatic name-resolution JSON counts containers including the root argument map and refuses beyond 128; direct raw-call conversion separately refuses recursion depth 128 before runtime encoding. Root allocate/swap and generated transaction Money fields share normalization of exact finite non-negative Decimal spellings at their CLI boundary, capped at 4096 raw UTF-8 bytes and exponent magnitude 4096 before coefficient conversion. Excess input refuses without rounding; strict shared money constructors, checked u64 range, native negative and exact sub-rao refusals remain unchanged."
rationale = "Bound memory and recursion for local untrusted inputs while preserving account selection. An oversized valid contact book must not become an empty book and redirect a same-name reference to a wallet. Finite acyclic reference chains and programmatic Values need explicit limits even when cycle detection and text-parser nesting checks are present. M8 also bounds wallet signature/ciphertext hex at 32 MiB and transfer-history responses at 16 MiB, 128 pages and 30 seconds total; history follows only HTTPS pagination on the expected endpoint and refuses cycles."
