[[divergences]]
id = "D-077"
upstream_symbol = "bittensor.executor.Executor.submit_shielded"
python_behavior = "Seals the inner extrinsic with the NextKey read before preparation, submits one carrier, and reports a dropped inner ('not included before its era expired') without retrying."
rtao_behavior = "Re-reads NextKey immediately before sealing, waits (bounded by ShieldOptions::finality_wait) until finality leaves half the 8-block era for inclusion, and when an included carrier's inner is proven absent through its finalized era expiry, re-seals the call with a fresh key and nonce pair up to ShieldOptions::dropped_inner_retries (default 3) more times. Rejection and unknown fate are still never retried."
rationale = "The shield key rotates every block and is valid for two block periods, so on fast development chains (250 ms blocks) a carrier has well under a second to land and the block author silently drops undecryptable inners. Proven absence through finalized era expiry means the inner never executed, so re-sealing cannot execute it twice; each retry costs one more small carrier fee. On mainnet the window is 12-24 s and retries are rare."
decision = "PLAN.md execution rule 5; live localnet CLI walkthrough of burned registration and staking on a fast spec 481 node (2026-10-18)"
