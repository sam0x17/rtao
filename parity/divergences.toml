[[divergences]]
id = "D-053"
upstream_symbol = "bittensor.masked_input.masked_input"
python_behavior = "Uses the interpreter-selected input codec and terminal signal bindings; getpass supplies hidden controlling-terminal fallback."
rtao_behavior = "Uses UTF-8 and fixed Ctrl-C/backspace/Ctrl-U/Ctrl-D bindings in owned Unix star and hidden editors. Ctrl-C restores terminal settings before cancellation in every parser state. Other ASCII control bytes are ignored; remapped signal keys are not interpreted. External signals have no restoration guarantee. Invalid UTF-8 is replaced during editing and rejected by the warned plain-line fallback. Windows is unsupported."
rationale = "The native String API has no interpreter codec. Disabling ISIG while interpreting fixed control keys avoids process termination, core dumps or suspension from those keys before Rust can restore termios. The controlling-terminal fallback shares the owned guard instead of raising SIGINT before restoration."
decision = "PLAN.md execution rule 5 design-gap resolution; docs/plan/architecture.md section 10.3"
status = "active"
class = "improved"
milestone = "M8"
pinning_tests = [
  "rtao_cli::prompt::masked_input::tests::unicode_entry_echoes_one_star_per_decoded_character_and_no_plaintext",
  "rtao_cli::prompt::masked_input::tests::cancellation_during_escape_parsing_restores_in_masked_and_hidden_modes",
  "rtao_cli::prompt::masked_input::tests::controlling_terminal_fallback_is_hidden_and_uses_owned_editing_and_restoration",
  "rtao_cli::prompt::masked_input::tests::controlling_terminal_fallback_cancellation_restores_and_never_retries_plain_input",
  "rtao_cli::prompt::masked_input::tests::controlling_terminal_failures_attempt_restoration_without_plain_input_retry",
  "rtao_cli::prompt::masked_input::tests::unavailable_controlling_terminal_selects_the_warned_plain_line_fallback",
]
upstream_report = "Native lifecycle adaptation and authored source fixtures; current hosted execution is pending. No upstream defect or new filing is claimed."
upstream_link = "https://github.com/RaoFoundation/subtensor/blob/850f2755bb05a3851f948489f0ab27b0645cebce/sdk/python/bittensor/masked_input.py"

