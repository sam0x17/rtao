[[divergences]]
id = "D-044"
upstream_symbol = "bittensor.cli.context.AppContext.submit PoW preparation and dry-run planning"
python_behavior = "PowRegister.build composes structurally valid work without checking the current public challenge. Unshielded CLI execution refreshes expired, future or difficulty-invalid work after confirmation and unlock. Dry-run planning can therefore preview stale work."
rtao_behavior = "The SDK validates the public challenge during build. Actual unshielded CLI requests refresh stale or difficulty-invalid work using public identities before strict planning and review, then recheck after confirmation and unlock. Dry runs do not mine or unlock and reject work that fails the SDK challenge checks. The higher-level subnets register --pow --dry-run refuses before initial search and points to the existing-proof tx preview. Proxy owner and explicit hotkey remain fixed."
rationale = "Retain the SDK's fail-closed PoW validation while allowing actual CLI requests to refresh their public proof. A dry run must not start CPU workers or acquire signing keys. Refresh timing and stale-proof preview acceptance differ deliberately from Python; successful registration semantics are preserved."
