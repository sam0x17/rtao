upstream_symbol = "bittensor.config address/proxy/multisig book and call-cache writers"
python_behavior = "The shared list/object files are written directly; malformed input is treated as empty without retaining a corruption backup. Cache presentation fields are stored without authenticating call_data against the key."
rtao_behavior = "Shared writers use bounded nonblocking regular-file reads and bounded serialization, exclusive same-directory temporary files, fsync and atomic rename. New Unix files/directories use 0600/0700; existing modes remain. Replacing malformed input retains its exact bytes in a unique corruption backup. Final symlinks and special files refuse. Cache save/load authenticate the call hash and bytes; load reconstructs canonical runtime-stamped calls without trusting cached params."
rationale = "Implement architecture section 10.2's atomic shared-file and corruption-retention requirement. Refuse malformed identities and unbounded local inputs before modifying user files. Portable reference order, unknown fields, native thresholds and btcli list/object schemas remain."
