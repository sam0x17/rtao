upstream_symbol = "Client.multisig / multisig_account"
python_behavior = "Derives accounts without checking singleton sets, duplicate signatories, invalid thresholds or the connected runtime MaxSignatories cap."
rtao_behavior = "Validates signer sets, thresholds and authenticated runtime MaxSignatories before returning a funding address; approval rechecks the live cap before funding probes, help or unlock, and origin composition enforces it."
