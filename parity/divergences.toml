  "rtao_core_ext::keyfile_json::tests::missing_keyfile_field_errors_redact_unknown_input_key_names",
]
upstream_report = "Filed secret URI disclosure as subtensor #3252. Current/MSRV constructor, keyfile differential and error-chain evidence is in docs/execution/m2-secret-boundaries.md. Dependency-owned signing objects and serde parser allocations remain separate open risks."
upstream_link = "https://github.com/RaoFoundation/subtensor/issues/3252"

[[divergences]]
id = "D-038"
upstream_symbol = "bittensor.http_auth.verify retention equality"
python_behavior = "A replay store retention equal to max_age + allowed_skew is accepted, although freshness and store expiry both include the equality boundary."
rtao_behavior = "Verifier construction requires retention strictly greater than max_age + allowed_skew; equality is rejected before serving requests."
class = "stricter"
rationale = "A future-boundary nonce remains fresh exactly when an equality-length replay record expires. Require a positive retention margin to avoid accepting the same nonce again at that endpoint."
decision = "PLAN.md execution rule 5; M3 security review (2026-10-14)"
pinning_tests = ["rtao_btauth::conformance::test_window_wider_than_store_retention_refused"]
upstream_report = "Source-backed boundary finding; actual source/proof and filing audit are in progress. Rust 1.89 constructor regression and independent M3 source review verify the local correction."
upstream_link = "https://github.com/RaoFoundation/subtensor/blob/850f2755bb05a3851f948489f0ab27b0645cebce/sdk/python/bittensor/http_auth.py"

