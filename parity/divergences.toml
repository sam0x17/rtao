id = "D-053"
upstream_symbol = "bittensor.masked_input.masked_input"
python_behavior = "Uses the interpreter-selected input codec and terminal signal bindings; getpass supplies hidden controlling-terminal fallback."
rtao_behavior = "Uses UTF-8 and fixed Ctrl-C/backspace/Ctrl-U/Ctrl-D bindings in owned Unix star and hidden editors. Physical Ctrl-C restores terminal settings before publishing cancellation. CancellableTerminal shares a latched invocation handle with bounded input/escape polling and no fallback/retry after cancellation. Main alone registers Unix SIGINT before prompts; library contexts install no handler. AppContext refuses new work/private acquisition, closes a simultaneous-ready client, and retains started boxed work through receipt hooks and signer release. Original results and recovery identities survive; final status is 130 and success replay is suppressed. Blocked OS/native work, arbitrary futures and competing stdin readers have no forced shutdown bound. Other ASCII control bytes are ignored; remapped signal keys are not interpreted. Invalid UTF-8 is replaced during editing and rejected by the warned plain-line fallback. Windows is unsupported."
rationale = "The native String API has no interpreter codec. Disabling ISIG while interpreting fixed control keys avoids process termination, core dumps or suspension from those keys before Rust can restore termios. The controlling-terminal fallback shares the owned guard instead of raising SIGINT before restoration."
decision = "PLAN.md execution rule 5 design-gap resolution; docs/plan/architecture.md section 10.3"
