# Handwritten name decisions for the authenticated Python environment inventory.
# Consumers below exist today. ENV-PENDING entries are milestone gaps, not
# claims that a future API is implemented. Replace them when its reader lands.
schema = 1

[env.BITTENSOR_EXTENSION_BRIDGE_PID]
divergence = "ENV-PENDING-M7-BRIDGE"
class = "pending"
python_behavior = "A nonempty override selects the extension daemon PID file; missing or empty selects the extracted home path."
rtao_behavior = "The extension daemon and its PID-file environment reader are not implemented."
rationale = "The signer crate currently provides the signing traits and software keys; the bridge belongs to M7-04."
resolution = "M7-04: implement rtao_signer::extension and replace this row with its PID-path reader."
evidence = "crates/rtao-signer/src/lib.rs"

[env.BITTENSOR_EXTENSION_BRIDGE_TOKEN]
