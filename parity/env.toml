# Handwritten name decisions for the authenticated Python environment inventory.
# Consumer rows name existing public entry points, with source-fixture evidence
# in their notes. A mapping does not claim that hosted validation has passed.
schema = 1

[env.BITTENSOR_EXTENSION_BRIDGE_PID]
consumer = "rtao_signer::extension::BridgePaths::from_environment"
rust_path = "crates/rtao-signer/src/extension/session.rs"
notes = "Reads a nonempty PID override; missing or empty uses HOME/.bittensor/extension_bridge.pid. Relative paths, literal tildes and whitespace remain unchanged. Injected source fixture: environment_tests::bridge_path_overrides_preserve_empty_relative_tilde_and_whitespace_semantics. This reader does not open, create or remove state."

[env.BITTENSOR_EXTENSION_BRIDGE_TOKEN]
consumer = "rtao_signer::extension::BridgePaths::from_environment"
rust_path = "crates/rtao-signer/src/extension/session.rs"
notes = "Reads a nonempty token-path override; missing or empty uses HOME/.bittensor/extension_bridge.token. Relative paths, literal tildes and whitespace remain unchanged. Uses the same injected path fixture as the PID row. Token contents are read separately through the bounded private-file guard."

[env.BITTENSOR_LOG]
consumer = "rtao_cli::logs::setup_logging"
rust_path = "crates/rtao-cli/src/logs.rs"
notes = "Reads BITTENSOR_LOG and passes it to LogPolicy::resolve. Python whitespace stripping and ASCII case folding select error/warning/info/debug/trace; empty or unknown values retain CLI verbosity/quiet. Source fixture: logging_contract::flag_ladder_and_environment_override_match_python. NeuronConfig::resolve_layers separately accepts the framework typed log-level input."

[env.BITTENSOR_RUNTIME_CACHE_DIR]
consumer = "rtao_client::RuntimeCache::default_disk_dir"
rust_path = "crates/rtao-client/src/cache.rs"
notes = "Reads the process override; missing or empty selects the home runtime-cache path. Disk caching remains explicitly enabled by the caller."

[env.BTCLI_ADDRESSES_PATH]
consumer = "rtao_client::config::Paths::from_process"
rust_path = "crates/rtao-client/src/config.rs"
file = "ConfigFile::Addresses"
notes = "ConfigFile::environment uses the generated ADDRESSES_ENV_VAR; Paths::new ignores missing/empty overrides and retains relative paths."

[env.BTCLI_CONFIG]
consumer = "rtao_client::config::Paths::from_process"
rust_path = "crates/rtao-client/src/config.rs"
file = "ConfigFile::Config"
notes = "ConfigFile::environment uses the generated CONFIG_ENV_VAR; Paths::new ignores missing/empty overrides and retains relative paths."

[env.BTCLI_MULTISIGS_PATH]
consumer = "rtao_client::config::Paths::from_process"
rust_path = "crates/rtao-client/src/config.rs"
file = "ConfigFile::Multisigs"
notes = "ConfigFile::environment uses the generated MULTISIGS_ENV_VAR; Paths::new ignores missing/empty overrides and retains relative paths."

[env.BTCLI_MULTISIG_CACHE]
consumer = "rtao_client::config::Paths::from_process"
rust_path = "crates/rtao-client/src/config.rs"
file = "ConfigFile::MultisigCache"
notes = "ConfigFile::environment uses the generated MULTISIG_CACHE_ENV_VAR; Paths::new ignores missing/empty overrides and retains relative paths."

[env.BTCLI_PROXIES_PATH]
consumer = "rtao_client::config::Paths::from_process"
rust_path = "crates/rtao-client/src/config.rs"
file = "ConfigFile::Proxies"
notes = "ConfigFile::environment uses the generated PROXIES_ENV_VAR; Paths::new ignores missing/empty overrides and retains relative paths."

[env.BTCLI_SUBNET_NAMES_CACHE]
consumer = "rtao_client::config::Paths::from_process"
rust_path = "crates/rtao-client/src/config.rs"
file = "ConfigFile::SubnetNames"
notes = "ConfigFile::environment uses the generated SUBNET_NAMES_ENV_VAR; Paths::new ignores missing/empty overrides and retains relative paths."

[env.BTCLI_TOKEN_SYMBOLS_CACHE]
consumer = "rtao_client::config::Paths::from_process"
rust_path = "crates/rtao-client/src/config.rs"
file = "ConfigFile::TokenSymbols"
notes = "ConfigFile::environment uses the generated TOKEN_SYMBOLS_ENV_VAR; Paths::new ignores missing/empty overrides and retains relative paths."

[env.BT_ARCHIVE_ENDPOINTS]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "Resolves root flag > nonempty environment > shared config; missing/empty retains config and network defaults. Connection setup parses the selected endpoints, including the explicit none sentinel. NeuronConfig::resolve_layers also consumes this name with injected environment/config fixtures."

[env.BT_CHAIN_ENDPOINT]
consumer = "rtao_client::Network::resolve"
rust_path = "crates/rtao-client/src/network.rs"
notes = "The generated NETWORKS local endpoint reads this override through Network::resolve_with; missing/empty selects the extracted local endpoint."

[env.BT_EVM_ENDPOINT]
consumer = "rtao_evm::evm_network"
rust_path = "crates/rtao-evm/src/networks.rs"
notes = "Only the local preset (including its known ws://127.0.0.1:9944 spelling) reads the nonempty HTTP endpoint override; missing/empty uses http://127.0.0.1:9944. Explicit HTTP(S) endpoints retain their identity. Injected source fixtures: networks::tests::local_environment_is_injectable_and_empty_means_unset and direct_urls_and_unknown_websocket_urls_preserve_identity."

[env.BT_EXTENSION_BRIDGE]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "Root flag precedes the nonempty environment URL. Globals::apply_with_env preserves the pinned leaf environment override for extension/tx tiers; read tiers retain root choices. The selected explicit URL is supplied to EnsureBridgeOptions, not inferred by its inert library constructor. Source fixture: globals::tests::external_leaf_env_overrides_root_flags_only_for_its_tier."

[env.BT_EXTENSION_BROWSER]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "CLI root flag > nonempty environment > config chooses the browser; leaf extension/tx overrides follow the pinned tier behavior. The library opener separately uses nonempty explicit-or-environment, recognizes normalized aliases, preserves raw custom names and tries Linux executable aliases in Python order before the system browser. Injected source fixtures: globals::tests::external_leaf_env_overrides_root_flags_only_for_its_tier and extension::session::environment_tests browser cases. No fixture launches a browser."

[env.BT_FALLBACK_ENDPOINTS]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "Resolves root flag > nonempty environment > shared config, followed by network defaults. Connection setup parses the selected endpoints, including none. NeuronConfig::resolve_layers also consumes this name with injected endpoint validation and precedence fixtures."

[env.BT_NETWORK]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "Resolves root flag > nonempty environment > shared config > extracted default. The library Network::resolve still takes an explicit selector; CLI and framework consume the process setting. Source fixtures: globals::tests::flag_env_config_default_precedence_and_wallet_provenance and NeuronConfig injected layer tests."

[env."BT_PW_*"]
consumer = "rtao_wallet::resolve_wallet_password"
rust_path = "crates/rtao-wallet/src/password.rs"
notes = "The expanded keyfile path replaces the platform separator and dots with underscores and is uppercased; the resolver uses the core decoder and ignores an empty decoded password. The same resolver handles local hotkeys without the global wallet password/file sources."

[env.BT_RETRY_FOREVER]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "The root true flag wins; otherwise a nonempty environment boolean overrides stored retry_forever. Accepted CLI spellings match Click (case/whitespace-insensitive 1/true/t/yes/y/on and 0/false/f/no/n/off); invalid spellings refuse. Missing/empty uses config/default. NeuronConfig::resolve_layers separately uses its documented typed boolean parser."

[env.BT_SIGNER_ADDRESS]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "Root flag precedes a nonempty environment address; it does not fall back to the similarly named config field. Applicable leaf extension/tx environment values override root state exactly as in Python. Read tiers keep the root choice. Source fixtures: external_leaf_env_overrides_root_flags_only_for_its_tier and configured_signer_address_does_not_acquire_flag_or_env_provenance."

[env.BT_WALLET]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "Resolves root flag > nonempty environment > stored wallet > default; a flag or nonempty environment value records explicit wallet provenance. Explicit leaf overrides win. Source fixture: globals::tests::flag_env_config_default_precedence_and_wallet_provenance. NeuronConfig consumes the same layers without making Wallet infer process settings."

[env.BT_WALLET_HOTKEY]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "Resolves root flag > nonempty environment > stored wallet_hotkey > default, recording explicit hotkey provenance for flag/environment values. Explicit leaf overrides win. Existing Globals and NeuronConfig layer fixtures use injected home/environment inputs."

[env.BT_WALLET_PASSWORD]
consumer = "rtao_wallet::resolve_wallet_password"
rust_path = "crates/rtao-wallet/src/password.rs"
notes = "An explicit nonempty password precedes the nonempty raw global wallet password, followed by the encoded per-keyfile family. Hotkey unlock does not consult this global source. Separately, the public EVM key helpers in crates/rtao-evm/src/keys.rs reach resolve_password_with: nonempty explicit > nonempty BT_WALLET_PASSWORD > caller resolver; its injected source fixture covers each boundary."

[env.BT_WALLET_PASSWORD_FILE]
consumer = "rtao_wallet::resolve_wallet_password"
rust_path = "crates/rtao-wallet/src/password.rs"
notes = "A nonempty explicit password_file precedes the nonempty environment path after global/per-keyfile passwords; the file's entire text is trimmed. Hotkey unlock does not consult this source. Globals::resolve now reads this environment-backed CLI option, while wallet hotkeys retain their separate sources."

[env.BT_WALLET_PATH]
consumer = "rtao_cli::globals::Globals::resolve"
rust_path = "crates/rtao-cli/src/globals.rs"
notes = "Resolves root flag > nonempty environment > stored wallet_path > HOME/.bittensor/wallets. Wallet itself continues to take explicit paths; NeuronConfig also resolves this process setting. Existing injected layer fixtures cover the selected path and default home."

[env.GH_TOKEN]
consumer = "rtao_cli::commands::multisig::execute"
rust_path = "crates/rtao-cli/src/commands/multisig.rs"
notes = "The public execution entry point delegates pending-upgrade discovery to GithubFetch::bytes. Its shared github_token selector is also used by upgrade artifacts on the authenticated API origin. Nonempty GH_TOKEN wins; missing/empty falls back to nonempty GITHUB_TOKEN, then no authorization. Injected source fixture commands::multisig::tests::github_token_precedence_is_lazy_and_treats_only_empty_values_as_unset checks lazy precedence and whitespace without process environment mutation. Upgrade request_headers fixtures separately check API-only sensitive credentials and redirect refusal. This is a transitive entry-point mapping, not a claim that execute itself always needs a token or that a constructor reads it."

[env.GITHUB_TOKEN]
consumer = "rtao_cli::commands::multisig::execute"
rust_path = "crates/rtao-cli/src/commands/multisig.rs"
notes = "The public execution entry point delegates pending-upgrade discovery to GithubFetch::bytes. Its shared github_token selector is also used by upgrade artifacts on the authenticated API origin. Nonempty GH_TOKEN wins; missing/empty falls back to nonempty GITHUB_TOKEN, then no authorization. Injected source fixture commands::multisig::tests::github_token_precedence_is_lazy_and_treats_only_empty_values_as_unset checks lazy precedence and whitespace without process environment mutation. Upgrade request_headers fixtures separately check API-only sensitive credentials and redirect refusal. This is a transitive entry-point mapping, not a claim that execute itself always needs a token or that a constructor reads it."

[env.TERM_PROGRAM]
divergence = "ENV-PRESENTATION-TERM-PROGRAM"
class = "presentation"
python_behavior = "Apple_Terminal disables OSC-8 hyperlinks so URLs are printed visibly; every other value, including missing/empty, permits hyperlinks."
rtao_behavior = "The current CLI prints plain text and no OSC-8 hyperlinks and does not read TERM_PROGRAM."
rationale = "Architecture section 4.9 explicitly marks TERM_PROGRAM n/a as terminal presentation. JSON and chain behavior are unaffected."
resolution = "Retain a reasoned presentation omission, or replace this row if the M4 output renderer adopts terminal-specific OSC-8 behavior."
evidence = "crates/rtao-cli/src/main.rs"
