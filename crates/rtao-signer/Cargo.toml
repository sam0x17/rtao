[package]
name = "rtao-signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true
description = "Bittensor signing contracts and key sources."

[lints]
workspace = true

[features]
ledger = ["rtao-core/ledger","rtao-core/offload"]
vault = ["rtao-core/offload", "dep:tokio", "dep:tokio-util", "dep:axum", "dep:hyper", "dep:hyper-util", "dep:tokio-tungstenite", "dep:futures", "dep:base64", "dep:hex", "dep:getrandom", "dep:qrcodegen"]
extension = ["dep:tokio", "dep:tokio-tungstenite", "dep:axum", "dep:hyper", "dep:hyper-util", "dep:futures", "dep:serde", "dep:http", "dep:url", "dep:hex", "dep:zeroize", "dep:rustls", "dep:rustls-native-certs", "dep:getrandom", "dep:nix", "dep:base64", "dep:subtle", "serde_json/preserve_order"]
test-util = []

[dependencies]
rtao-core = { workspace = true }
rtao-primitives = { workspace = true }
bitflags = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"], optional = true }
tokio-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
http = { workspace = true, optional = true }
url = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
qrcodegen = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
hex = { workspace = true }
parity-scale-codec = { workspace = true }
rqrr = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }

