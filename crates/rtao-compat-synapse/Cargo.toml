[package]
name = "rtao-compat-synapse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0 AND MIT"
repository.workspace = true
description = "Wire compatibility with bittensor 10.5.0 Synapse, Axon and Dendrite peers."

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lints]
workspace = true

[features]
default = ["axon", "dendrite", "tensor"]
axon = ["dep:axum", "dep:tokio", "dep:http-body-util", "dep:futures", "dep:bytes"]
dendrite = ["dep:reqwest", "dep:rustls", "dep:tokio", "dep:futures", "dep:bytes", "dep:url"]
tensor = []

[dependencies]
rtao-primitives = { workspace = true }
rtao-core = { workspace = true }
rtao-signer = { workspace = true }
rtao-btauth = { workspace = true, features = ["legacy-v10"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
http = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
blake2 = { workspace = true }
getrandom = { workspace = true }
sha3 = "0.10.8"
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }

[[example]]
name = "interop_axon"
required-features = ["axon", "tensor"]

[[example]]
name = "interop_dendrite"
required-features = ["axon", "dendrite", "tensor"]
