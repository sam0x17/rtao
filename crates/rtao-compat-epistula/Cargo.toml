[package]
name = "rtao-compat-epistula"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND MIT"
repository.workspace = true
description = "Epistula v2 signed HTTP headers with upstream dialect presets."
keywords = ["bittensor", "epistula", "authentication", "http", "signature"]
categories = ["authentication", "cryptography::cryptocurrencies"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lints]
workspace = true

[features]
server = ["rtao-btauth/server", "dep:axum", "dep:tower", "dep:http-body-util", "dep:tokio"]
client = ["dep:reqwest"]
redis = ["rtao-btauth/redis"]
metagraph-policy = ["server", "rtao-btauth/metagraph-policy"]
secret-filter = []

[dependencies]
rtao-btauth = { workspace = true }
rtao-signer = { workspace = true }
rtao-core = { workspace = true }
rtao-primitives = { workspace = true }
http = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
getrandom = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
rustls = { workspace = true }

[[example]]
name = "epistula_interop"
required-features = ["server", "client"]
