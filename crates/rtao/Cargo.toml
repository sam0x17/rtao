[package]
name = "rtao"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true
description = "Rust SDK, operator framework and the rtao command line application for Bittensor subnets."
documentation = "https://docs.rs/rtao"
readme = "README.md"
keywords = ["bittensor", "sdk", "blockchain", "substrate", "tao"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "command-line-utilities"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
# The CLI (`cli`, a default feature) is not part of the library documentation.
no-default-features = true
features = ["full","validator","miner","owner","pow-gpu","subxt"]

[lints]
workspace = true

[features]
# `cli` is a default so that `cargo install rtao` installs the full `rtao`
# binary with no flags. Libraries depend on rtao with `default-features = false`
# and name the features they use; the library never links rtao-cli (D-190).
default = ["client","reads","tx","cli"]
cli = ["dep:rtao-cli"]
client = ["dep:rtao-client"]
reads = ["client","dep:rtao-reads"]
tx = ["client","dep:rtao-tx","dep:rtao-signer"]
intents = ["tx","reads","dep:rtao-intents"]
metagraph = ["reads","dep:rtao-metagraph"]
wallet = ["dep:rtao-wallet"]
wallet-encrypted = ["wallet","rtao-wallet/encrypted"]
btauth = ["dep:rtao-btauth"]
btauth-server = ["btauth","rtao-btauth/server","rtao-btauth/metagraph-policy","metagraph"]
btauth-client = ["btauth","rtao-btauth/client"]
http-auth = ["btauth","tx","dep:rtao-runtime","dep:serde_json","dep:http"]
redis = ["rtao-btauth/redis"]
neuron = ["intents","metagraph","wallet","btauth-client","dep:rtao-neuron"]
validator = ["neuron","rtao-intents/weights","rtao-intents/serving","rtao-intents/commitments","rtao-neuron/validator"]
miner = ["neuron","btauth-server","rtao-intents/serving","rtao-intents/commitments","rtao-neuron/miner"]
owner = ["neuron","wallet-encrypted","rtao-neuron/owner","rtao-intents/registration","rtao-intents/governance","rtao-intents/hyperparameters","rtao-intents/identity","rtao-intents/proxy","rtao-intents/multisig","rtao-intents/collateral"]
intents-all = ["intents","rtao-intents/all"]
pow = ["intents","rtao-intents/pow"]
pow-gpu = ["pow","rtao-intents/pow-gpu","rtao-cli?/pow-gpu"]
ledger = ["rtao-signer/ledger","rtao-cli?/ledger"]
vault = ["rtao-signer/vault","rtao-cli?/vault"]
extension = ["rtao-signer/extension","rtao-cli?/extension"]
keychain = ["rtao-wallet/keychain"]
evm = ["dep:rtao-evm","rtao-cli?/evm"]
blocking = ["intents-all","metagraph","wallet","rtao-client/blocking","dep:rtao-runtime","dep:rtao-catalog","dep:bytes","dep:futures","dep:serde_json","dep:tokio"]
prometheus = ["rtao-neuron?/prometheus","rtao-jsonrpc/metrics"]
subxt = ["rtao-client/subxt"]
compat-synapse = ["dep:rtao-compat-synapse","rtao-compat-synapse/axon","rtao-compat-synapse/dendrite","rtao-compat-synapse/tensor"]
compat-epistula = ["dep:rtao-compat-epistula","rtao-compat-epistula/server","rtao-compat-epistula/client"]
transport-quic = ["dep:rtao-transport-quic","rtao-transport-quic/client","rtao-transport-quic/server"]
remote-signer = ["tx","btauth-client","dep:rtao-remote-signer","rtao-remote-signer/client","rtao-cli?/remote-signer"]
remote-signer-server = ["remote-signer","rtao-remote-signer/server-online"]
full = ["intents-all","metagraph","wallet-encrypted","btauth-server","btauth-client","http-auth","redis","neuron","rtao-neuron/validator","rtao-neuron/miner","rtao-neuron/owner","pow","ledger","vault","extension","keychain","evm","blocking","prometheus","compat-synapse","compat-epistula","transport-quic","remote-signer","remote-signer-server"]

[dependencies]
rtao-core.workspace = true
rtao-primitives.workspace = true
rtao-jsonrpc.workspace = true
rtao-client = { workspace = true, optional = true }
rtao-reads = { workspace = true, optional = true }
rtao-tx = { workspace = true, optional = true }
rtao-signer = { workspace = true, optional = true }
rtao-intents = { workspace = true, optional = true }
rtao-metagraph = { workspace = true, optional = true }
rtao-wallet = { workspace = true, optional = true }
rtao-btauth = { workspace = true, optional = true }
rtao-neuron = { workspace = true, optional = true }
rtao-evm = { workspace = true, optional = true }
rtao-runtime = { workspace = true, optional = true }
rtao-catalog = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rtao-compat-synapse = { workspace = true, optional = true }
rtao-compat-epistula = { workspace = true, optional = true }
rtao-transport-quic = { workspace = true, optional = true }
rtao-remote-signer = { workspace = true, optional = true }
rtao-cli = { workspace = true, optional = true }

[dev-dependencies]
# Workspace crates are path-only dev-dependencies: `cargo publish` strips them,
# so the testkit and intents dev-dependency cycles never reach crates.io (D-181).
docify.workspace = true
rtao-testkit = { path = "../rtao-testkit", default-features = false }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
tokio.workspace = true
http.workspace = true
serde_json.workspace = true
hex.workspace = true
zeroize.workspace = true
# The CLI entry-point tests below run the `rtao` binary and use these crates
# directly (D-190).
rtao-client = { path = "../rtao-client", default-features = false }
rtao-tx = { path = "../rtao-tx", default-features = false }
rtao-signer = { path = "../rtao-signer", default-features = false }
rtao-wallet = { path = "../rtao-wallet", default-features = false }
rtao-catalog = { path = "../rtao-catalog", default-features = false }
rtao-intents = { path = "../rtao-intents", default-features = false }

# The `rtao` command line application. `doc = false`: the library and the
# binary share the name `rtao` and would both document to `target/doc/rtao/`.
[[bin]]
name = "rtao"
path = "src/main.rs"
required-features = ["cli"]
doc = false

[[test]]
name = "catalog_entrypoint"
required-features = ["cli"]

[[test]]
name = "entrypoint_contract"
required-features = ["cli"]

[[test]]
name = "file_input_contract"
required-features = ["cli"]

[[test]]
name = "generic_wallet_prompts"
required-features = ["cli"]

[[test]]
name = "m7_auxiliary_entrypoint"
required-features = ["cli"]

[[test]]
name = "m8_help_theme"
required-features = ["cli"]

[[test]]
name = "m8_misc_entrypoint"
required-features = ["cli"]

[[test]]
name = "m8_upgrade_entrypoint"
required-features = ["cli"]

[[test]]
name = "startup_contract"
required-features = ["cli"]

[[test]]
name = "wallet_commands"
required-features = ["cli"]

[[example]]
name = "validator"
required-features = ["validator"]

[[example]]
name = "miner"
required-features = ["miner"]

[[example]]
name = "owner"
required-features = ["owner"]
