[package]
name = "rtao"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true
description = "Rust SDK and operator framework for Bittensor subnets."
keywords = ["bittensor", "sdk", "blockchain", "substrate", "tao"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = ["full","validator","miner","owner","pow-gpu","subxt"]

[lints]
workspace = true

[features]
default = ["client","reads","tx"]
client = ["dep:rtao-client"]
reads = ["client","dep:rtao-reads"]
tx = ["client","dep:rtao-tx","dep:rtao-signer"]
intents = ["tx","reads","dep:rtao-intents"]
metagraph = ["reads","dep:rtao-metagraph"]
wallet = ["dep:rtao-wallet"]
wallet-encrypted = ["wallet","rtao-wallet/encrypted"]
btauth = ["dep:rtao-btauth"]
btauth-server = ["btauth","rtao-btauth/server","rtao-btauth/metagraph-policy","metagraph"]
btauth-client = ["btauth","rtao-btauth/client"]
redis = ["rtao-btauth/redis"]
neuron = ["intents","metagraph","wallet","btauth-client","dep:rtao-neuron"]
validator = ["neuron","rtao-intents/weights","rtao-intents/serving","rtao-neuron/validator"]
miner = ["neuron","btauth-server","rtao-intents/serving","rtao-neuron/miner"]
owner = ["neuron","wallet-encrypted","rtao-neuron/owner","rtao-intents/registration","rtao-intents/governance","rtao-intents/hyperparameters","rtao-intents/identity","rtao-intents/proxy","rtao-intents/multisig","rtao-intents/collateral"]
intents-all = ["intents","rtao-intents/all"]
pow = ["intents","rtao-intents/pow"]
pow-gpu = ["pow","rtao-intents/pow-gpu"]
ledger = ["rtao-signer/ledger"]
vault = ["rtao-signer/vault"]
extension = ["rtao-signer/extension"]
keychain = ["rtao-wallet/keychain"]
evm = ["dep:rtao-evm"]
blocking = ["intents-all","metagraph","wallet","rtao-client/blocking","dep:rtao-runtime","dep:rtao-catalog","dep:bytes","dep:futures","dep:serde_json","dep:tokio"]
prometheus = ["rtao-neuron?/prometheus","rtao-rpc/metrics"]
subxt = ["rtao-client/subxt"]
compat-synapse = ["dep:rtao-compat-synapse","rtao-compat-synapse/axon","rtao-compat-synapse/dendrite","rtao-compat-synapse/tensor"]
compat-epistula = ["dep:rtao-compat-epistula","rtao-compat-epistula/server","rtao-compat-epistula/client"]
transport-quic = ["dep:rtao-transport-quic","rtao-transport-quic/client","rtao-transport-quic/server"]
remote-signer = ["tx","btauth-client","dep:rtao-remote-signer","rtao-remote-signer/client"]
remote-signer-server = ["remote-signer","rtao-remote-signer/server-online"]
full = ["intents-all","metagraph","wallet-encrypted","btauth-server","btauth-client","redis","neuron","rtao-neuron/validator","rtao-neuron/miner","rtao-neuron/owner","pow","ledger","vault","extension","keychain","evm","blocking","prometheus","compat-synapse","compat-epistula","transport-quic","remote-signer","remote-signer-server"]

[dependencies]
rtao-core.workspace = true
rtao-primitives.workspace = true
rtao-rpc.workspace = true
rtao-client = { workspace = true, optional = true }
rtao-reads = { workspace = true, optional = true }
rtao-tx = { workspace = true, optional = true }
rtao-signer = { workspace = true, optional = true }
rtao-intents = { workspace = true, optional = true }
rtao-metagraph = { workspace = true, optional = true }
rtao-wallet = { workspace = true, optional = true }
rtao-btauth = { workspace = true, optional = true }
rtao-neuron = { workspace = true, optional = true }
rtao-evm = { workspace = true, optional = true }
rtao-runtime = { workspace = true, optional = true }
rtao-catalog = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rtao-compat-synapse = { workspace = true, optional = true }
rtao-compat-epistula = { workspace = true, optional = true }
rtao-transport-quic = { workspace = true, optional = true }
rtao-remote-signer = { workspace = true, optional = true }

[dev-dependencies]
docify.workspace = true
rtao-testkit.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
tokio.workspace = true
http.workspace = true
serde_json.workspace = true

[[example]]
name = "validator"
required-features = ["validator"]

[[example]]
name = "miner"
required-features = ["miner"]

[[example]]
name = "owner"
required-features = ["owner"]
