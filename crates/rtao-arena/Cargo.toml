[package]
name = "rtao-arena"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Fixed-capacity memory for wasm32 and other hosts whose linear memory must never grow."
keywords = ["allocator", "arena", "no-std", "wasm", "tlsf"]
categories = ["memory-management", "no-std", "wasm"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

# The workspace forbids unsafe code. An allocator cannot be written without it,
# so this crate denies it at crate level and allows it only in the modules that
# manage raw memory (see CONTRIBUTING.md). The other workspace lints are copied
# because a crate cannot inherit part of `[workspace.lints]`.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[features]
default = ["std"]
# `Global`, `Block<Global>` and `FixedVec<T, Global>` over the global allocator.
alloc = []
# Thread-local allocation context (scopes on native targets need it) and the
# conformance allocator for native test binaries.
std = ["alloc"]

[dependencies]
