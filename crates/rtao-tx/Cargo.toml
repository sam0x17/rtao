rtao-primitives.workspace = true
rtao-rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
hex.workspace = true
smallvec = "1"

[dev-dependencies]
rtao-testkit = { workspace = true, features = ["core-policy"] }
rtao-intents = { workspace = true, features = ["transfer", "registration", "hyperparameters", "staking", "children", "evm"] }

