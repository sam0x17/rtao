[package]
name = "rtao-tx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true
description = "Bittensor execution plans, policies and transaction results."
documentation = "https://docs.rs/rtao-tx"
readme = "README.md"
keywords = ["bittensor", "transactions", "extrinsic", "blockchain"]
categories = ["cryptography::cryptocurrencies"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rtao-client = { workspace = true }
rtao-catalog = { workspace = true }
rtao-signer = { workspace = true }
rtao-core = { workspace = true, features = ["offload"] }
rtao-runtime.workspace = true
rtao-primitives.workspace = true
rtao-jsonrpc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
hex.workspace = true
smallvec = "1"
chrono.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Workspace crates are path-only dev-dependencies: `cargo publish` strips them,
# so the testkit and intents dev-dependency cycles never reach crates.io (D-181).
rtao-client = { path = "../rtao-client", default-features = false, features = ["test-util"] }
rtao-testkit = { path = "../rtao-testkit", default-features = false, features = ["core-policy", "journal-shield"] }
rtao-intents = { path = "../rtao-intents", default-features = false, features = ["serving", "transfer", "registration", "hyperparameters", "staking", "children", "evm", "proxy"] }
tokio = { workspace = true, features = ["test-util"] }
rcgen.workspace = true
tokio-rustls.workspace = true

