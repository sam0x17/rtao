[package]
name = "rtao-intents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true
description = "Bittensor transaction intents."
documentation = "https://docs.rs/rtao-intents"
readme = "README.md"
keywords = ["bittensor", "transactions", "staking", "blockchain"]
categories = ["cryptography::cryptocurrencies"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lints]
workspace = true

[features]
association = []
batch = []
children = []
coldkey = []
commitments = []
crowdloan = []
emission_weights = ["dep:rtao-reads"]
evm = []
leasing = []
lock = []
root = []
transfer = []
staking = ["dep:futures"]
weights = ["dep:tokio"]
serving = []
registration = ["dep:futures"]
governance = ["hyperparameters"]
hyperparameters = ["dep:futures", "dep:tokio", "dep:tokio-util"]
identity = []
proxy = []
multisig = ["dep:tokio"]
collateral = ["dep:tokio"]
pow = ["rtao-core/host", "dep:tokio", "dep:tokio-util"]
pow-gpu = ["pow"]
# Runtime 487/488 catalog categories; their intents are pending ports (D-128).
gamma = ["dep:rtao-reads"]
limit_orders = []
all = ["association", "batch", "children", "coldkey", "commitments", "collateral", "crowdloan", "emission_weights", "evm", "gamma", "governance", "hyperparameters", "identity", "leasing", "limit_orders", "lock", "multisig", "proxy", "registration", "root", "serving", "staking", "transfer", "weights"]

[dependencies]
rtao-tx = { workspace = true }
rtao-reads = { workspace = true, optional = true }
rtao-core.workspace = true
rtao-primitives.workspace = true
rtao-catalog.workspace = true
rtao-client.workspace = true
rtao-runtime.workspace = true
rtao-signer.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
smallvec = "1"
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
# Workspace crates are path-only dev-dependencies: `cargo publish` strips them,
# so the testkit and intents dev-dependency cycles never reach crates.io (D-181).
criterion = "0.7"
tokio.workspace = true
rtao-testkit = { path = "../rtao-testkit", default-features = false }
rtao-reads = { path = "../rtao-reads", default-features = false }
anyhow.workspace = true

[[bench]]
name = "weights"
harness = false
required-features = ["weights"]

