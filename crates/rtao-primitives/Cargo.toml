[package]
name = "rtao-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0 AND PSF-2.0"
repository.workspace = true
description = "Identifiers, amounts and shared Bittensor vocabulary."
keywords = ["bittensor", "primitives", "balance", "ss58", "blockchain"]
categories = ["cryptography::cryptocurrencies", "data-structures"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lints]
workspace = true

[features]
default = ["serde"]
serde = []
schemars = ["dep:schemars"]

[dependencies]
url.workspace = true
rtao-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parity-scale-codec = { workspace = true }
scale-decode = { workspace = true }
scale-info = { workspace = true }
scale-type-resolver = { workspace = true }
schemars = { workspace = true, optional = true }
ryu = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
chrono = { workspace = true }
unicode-general-category = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

