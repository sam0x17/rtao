[package]
name = "rtao-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0 AND PSF-2.0"
repository.workspace = true
description = "The library behind the rtao command line application (install it with `cargo install rtao`)."
documentation = "https://docs.rs/rtao-cli"
readme = "README.md"
keywords = ["bittensor", "cli", "btcli", "wallet", "blockchain"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
features = ["ledger","vault","extension","evm","pow-gpu","remote-signer"]

[lints]
workspace = true

[features]
ledger = ["rtao-signer/ledger"]
vault = ["rtao-signer/vault"]
extension = ["rtao-signer/extension"]
remote-signer = ["dep:rtao-remote-signer", "rtao-remote-signer/client"]
evm = ["dep:rtao-evm"]
pow-gpu = ["rtao-intents/pow-gpu"]

[dependencies]
rtao-core.workspace = true
rtao-primitives.workspace = true
rtao-client.workspace = true
rtao-reads.workspace = true
rtao-tx.workspace = true
rtao-signer.workspace = true
rtao-wallet = { workspace = true, features = ["encrypted", "keychain"] }
rtao-neuron = { workspace = true, features = ["owner"] }
rtao-evm = { workspace = true, optional = true }
rtao-catalog.workspace = true
rtao-runtime.workspace = true
rtao-jsonrpc.workspace = true
rtao-intents = { workspace = true, features = ["all", "pow"] }
toml_edit.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde.workspace = true
clap = { workspace = true, features = ["string"] }
clap_complete.workspace = true
tokio = { workspace = true, features = ["process"] }
secrecy.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["registry", "fmt"] }
comfy-table = "7"
url.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
jiff = "0.2"
hex.workspace = true
sha2.workspace = true
futures.workspace = true
which = "8"
smallvec = "1"
parking_lot = "0.12"
caseless = "=0.2.2"
unicode-general-category.workspace = true
rtao-remote-signer = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { workspace = true, features = ["term", "poll"] }

# Hidden entry outside the supported Unix set (prompt/masked_input.rs).
[target.'cfg(not(unix))'.dependencies]
rpassword = "7"

[dev-dependencies]
# Workspace crates are path-only dev-dependencies: `cargo publish` strips them,
# so the testkit and intents dev-dependency cycles never reach crates.io (D-181).
rtao-testkit = { path = "../rtao-testkit", default-features = false }
rtao-remote-signer = { path = "../rtao-remote-signer", default-features = false, features = ["client", "server"] }
rtao-btauth = { path = "../rtao-btauth", default-features = false }
