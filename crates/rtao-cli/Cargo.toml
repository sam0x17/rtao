[package]
name = "rtao-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0 AND PSF-2.0"
repository.workspace = true
description = "The rtao command line application."

[lints]
workspace = true

[features]
ledger = ["rtao/ledger"]
vault = ["rtao/vault"]
extension = ["rtao/extension"]
evm = ["rtao/evm"]

[dependencies]
rtao = { workspace = true, features = ["client", "reads", "tx", "intents", "wallet-encrypted", "keychain"] }
rtao-catalog.workspace = true
rtao-runtime.workspace = true
rtao-rpc.workspace = true
rtao-intents = { workspace = true, features = ["weights", "serving", "registration", "pow", "governance", "hyperparameters", "identity", "transfer"] }
toml_edit.workspace = true
serde_json.workspace = true
serde.workspace = true
clap = { workspace = true, features = ["string"] }
tokio = { workspace = true, features = ["process"] }
secrecy.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["registry", "fmt"] }
rpassword = "7"
comfy-table = "7"
url.workspace = true
hex.workspace = true
futures.workspace = true
which = "8"
smallvec = "1"
parking_lot = "0.12"
caseless = "=0.2.2"
unicode-general-category.workspace = true

[dev-dependencies]
rtao-testkit.workspace = true

[[bin]]
name = "rtao"
path = "src/main.rs"
doc = false
