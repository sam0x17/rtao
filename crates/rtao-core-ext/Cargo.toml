[package]
name = "rtao-core-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0 AND Unicode-DFS-2016"
repository.workspace = true
description = "Staged extensions for the upstream Bittensor core."
documentation = "https://docs.rs/rtao-core-ext"
readme = "README.md"
keywords = ["bittensor", "blockchain", "scale", "metadata"]
categories = ["cryptography::cryptocurrencies", "encoding"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
bittensor-core.workspace = true
serde.workspace = true
serde_json.workspace = true
parity-scale-codec.workspace = true
scale-info.workspace = true
frame-metadata.workspace = true
hex.workspace = true
zeroize.workspace = true

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "protocol"
harness = false

