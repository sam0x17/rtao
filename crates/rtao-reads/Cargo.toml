[package]
name = "rtao-reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true
description = "Typed Bittensor reads and namespaces."
documentation = "https://docs.rs/rtao-reads"
readme = "README.md"
keywords = ["bittensor", "queries", "storage", "blockchain"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rtao-client = { workspace = true }
rtao-catalog = { workspace = true }
rtao-runtime = { workspace = true }
rtao-core = { workspace = true }
rtao-primitives = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
# Workspace crates are path-only dev-dependencies: `cargo publish` strips them,
# so the testkit and intents dev-dependency cycles never reach crates.io (D-181).
rtao-testkit = { path = "../rtao-testkit", default-features = false }

