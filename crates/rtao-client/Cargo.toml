[package]
name = "rtao-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true
description = "Asynchronous Bittensor chain access."
documentation = "https://docs.rs/rtao-client"
readme = "README.md"
keywords = ["bittensor", "rpc", "client", "blockchain", "substrate"]
categories = ["cryptography::cryptocurrencies", "api-bindings", "asynchronous"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
features = ["blocking","subxt","metrics"]

[lints]
workspace = true

[features]
blocking = []
subxt = ["dep:subxt"]
metrics = ["rtao-jsonrpc/metrics","dep:metrics"]
test-util = []

[dependencies]
rtao-jsonrpc = { workspace = true, features = ["rate-limit"] }
rtao-runtime = { workspace = true }
rtao-catalog = { workspace = true }
rtao-signer = { workspace = true }
rtao-core = { workspace = true, features = ["offload"] }
rtao-primitives.workspace = true
url.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
tokio-util.workspace = true
subxt-rpcs.workspace = true
subxt = { workspace = true, optional = true }
tracing.workspace = true
blake2.workspace = true
parity-scale-codec.workspace = true
scale-decode.workspace = true
scale-info.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
unicode-general-category.workspace = true
metrics = { workspace = true, optional = true }
regex.workspace = true
chrono.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Workspace crates are path-only dev-dependencies: `cargo publish` strips them,
# so the testkit and intents dev-dependency cycles never reach crates.io (D-181).
blake2.workspace = true
frame-metadata.workspace = true
k256.workspace = true
rtao-testkit = { path = "../rtao-testkit", default-features = false }

