[package]
name = "rtao-neuron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "(MIT OR Apache-2.0) AND Apache-2.0"
repository.workspace = true
description = "Bittensor validator, miner and owner runtimes."
documentation = "https://docs.rs/rtao-neuron"
readme = "README.md"
keywords = ["bittensor", "validator", "miner", "subnet", "framework"]
categories = ["cryptography::cryptocurrencies", "network-programming"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lints]
workspace = true

[features]
default = ["prometheus"]
validator = ["dep:rtao-intents", "dep:rtao-btauth", "dep:rtao-tx", "dep:rtao-signer", "rtao-intents/weights", "rtao-intents/serving"]
miner = ["dep:rtao-intents", "dep:rtao-btauth", "dep:rtao-tx", "dep:rtao-signer", "rtao-intents/serving", "rtao-btauth/server", "rtao-btauth/metagraph-policy", "dep:axum", "dep:reqwest", "dep:rustls", "dep:rustls-native-certs"]
owner = ["dep:rtao-intents", "dep:rtao-tx", "dep:rtao-signer", "rtao-intents/hyperparameters", "rtao-intents/registration", "rtao-intents/governance", "rtao-intents/identity"]
prometheus = ["dep:metrics", "rtao-jsonrpc/metrics"]

[dependencies]
rtao-intents = { workspace = true, optional = true }
rtao-metagraph = { workspace = true }
rtao-btauth = { workspace = true, features = ["client"], optional = true }
rtao-wallet = { workspace = true }
rtao-client.workspace = true
rtao-tx = { workspace = true, optional = true }
rtao-primitives = { workspace = true, features = ["serde"] }
rtao-signer = { workspace = true, optional = true }
rtao-core.workspace = true
rtao-runtime.workspace = true
rtao-core-ext.workspace = true
rtao-catalog.workspace = true
rtao-jsonrpc.workspace = true
rtao-reads.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json"] }
metrics = { workspace = true, optional = true }
blake2.workspace = true
hex.workspace = true
thiserror.workspace = true
url = { workspace = true, features = ["serde"] }
axum = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }

[dev-dependencies]
# Workspace crates are path-only dev-dependencies: `cargo publish` strips them,
# so the testkit and intents dev-dependency cycles never reach crates.io (D-181).
rtao-client = { path = "../rtao-client", default-features = false, features = ["test-util"] }
rtao-testkit = { path = "../rtao-testkit", default-features = false, features = ["journal-shield"] }
frame-metadata.workspace = true
scale-info.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "rtao-validator"
path = "src/bin/validator.rs"
required-features = ["validator"]

