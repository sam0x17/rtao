[package]
name = "rtao-btauth-two-provider-check"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["client"]
client = []

[dependencies]
rtao-btauth = { path = "/Users/sam/workspace/rtao/crates/rtao-btauth", features = ["client"] }
rtao-primitives = { path = "/Users/sam/workspace/rtao/crates/rtao-primitives" }
rtao-signer = { path = "/Users/sam/workspace/rtao/crates/rtao-signer" }
futures = "0.3"
http = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "aws-lc-rs", "std", "tls12"] }
rustls-pki-types = "1"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
url = "2"

[patch.crates-io]
w3f-bls = { git = "https://github.com/RaoFoundation/subtensor.git", tag = "v478" }

[[test]]
name = "signed_client_https"
path = "/Users/sam/workspace/rtao/crates/rtao-btauth/tests/client.rs"
