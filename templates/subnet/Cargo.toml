[workspace]
resolver = "3"
members = ["validator", "miner", "owner-tool", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The released SDK from crates.io; all three share one version. Cargo.lock
# records the exact release and the republished core packages it resolved.
rtao = { version = "0.1", default-features = false }
rtao-testkit = { version = "0.1", default-features = false, features = ["docker"] }
rtao-runtime = { version = "0.1", default-features = false }
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
http = "1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = { version = "1.0.132", features = ["arbitrary_precision"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal"] }
toml_edit = "0.23"
