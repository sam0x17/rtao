[workspace]
resolver = "3"
members = ["validator", "miner", "owner-tool", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Use the first released rtao-v tag here at the first rtao release. Before release,
# the generated project's lockfile records the exact main commit it resolved.
rtao = { git = "https://github.com/sam0x17/rtao", branch = "main", default-features = false }
rtao-testkit = { git = "https://github.com/sam0x17/rtao", branch = "main", default-features = false, features = ["docker"] }
rtao-runtime = { git = "https://github.com/sam0x17/rtao", branch = "main", default-features = false }
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
http = "1.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = { version = "1.0.132", features = ["arbitrary_precision"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal"] }
toml_edit = "0.23"

# Cargo ignores patches in dependencies and workspace members. Keep these once,
# in the final workspace root, equal to rtao's: the BLS patch at the core pin,
# and the core patch at rtao's reviewed fork revision (it wipes hashed signing
# keys; its own path packages stay at the core pin).
[patch.crates-io]
w3f-bls = { git = "https://github.com/RaoFoundation/subtensor.git", tag = "v490" }

[patch."https://github.com/RaoFoundation/subtensor.git"]
bittensor-core = { git = "https://github.com/sam0x17/subtensor.git", rev = "d7fd8762625a93b9837cde28d496b0819a976f0e" }

[patch."https://github.com/sam0x17/subtensor.git"]
fips204 = { git = "https://github.com/RaoFoundation/subtensor.git", tag = "v490" }
subtensor-hashed = { git = "https://github.com/RaoFoundation/subtensor.git", tag = "v490" }
subtensor-macros = { git = "https://github.com/RaoFoundation/subtensor.git", tag = "v490" }
w3f-bls = { git = "https://github.com/RaoFoundation/subtensor.git", tag = "v490" }
