name: runtime-adopt
# Hourly adoption of activated runtimes (AGENTS.md's runtime adoption
# policy; ci/runtime-adopt.sh). A newer Finney spec is pinned, regenerated
# and checked in a disposable candidate; a new testnet runtime is indexed.
# A new runtime is acted on only when a second public endpoint reports it at
# the same block on its own finalized chain, and a Finney adoption approves
# itself on live evidence (the pinned :code and V15/V16 metadata digests read
# at the pinned block, finalized on each, from at least two agreeing
# endpoints, the release wasm when published),
# the pipeline's checks and live reads with the built CLI; changed hand ports
# are listed in parity/port_due.toml rather than holding the runtime back.
# When every stage passes, the commit leaves the read-only adopt job as a
# git bundle and a push job that builds nothing pushes it to main (a Finney
# adoption with a changelog entry and a snapshot tag, atomically); if main
# moved meanwhile the next run starts again. Otherwise main is unchanged,
# one issue is opened or refreshed and, when the RUNTIME_ALERT_URL and
# RUNTIME_ALERT_TOKEN secrets are set, an alert is posted once per failure.
# A failed adoption backs off (1 h doubling per failed attempt, at most
# 24 h, from when it failed) unless main changes its inputs or a dispatch
# forces it. A bundle that changes the tooling that validated it is refused.
# Upstream branches ahead of every network keep one informational issue for
# pre-staging, and due hand ports another; neither alerts.
# A dispatch with core_bump also moves a core held behind the parity pin
# (D-127) to the parity pin's core, through the same adopt and push jobs and
# checks (D-136); scheduled runs never bump the core.
# Republished core packages (D-188): after the push, main's upstream.toml
# [publish] entries without a checksum (a core bump's or a new adaptation
# revision's rtao-upstream-* versions) are packaged and verified against
# their revisions in a read-only job, published in dependency order by a job
# that holds CRATES_IO_TOKEN and builds nothing, checked again with forks
# verify-published in a read-only job that commits the checksums as a bundle,
# and pushed by a job that builds nothing. Success opens an issue proposing an
# rtao release; rtao's own crates are never published here. A failure
# commits nothing, opens an issue and alerts. Dry runs and runs off main
# publish nothing.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every stage but push nothing and open no issue or alert
        type: boolean
        default: true
      simulate:
        description: A JSON observation to decide on instead of the live chains (never pushed)
        type: string
        default: ''
      force:
        description: Attempt the adoption even while a failed one is backing off
        type: boolean
        default: false
      core_bump:
        description: Move a held core to the parity pin's core (D-127) when Finney runs the parity runtime (core-patch rebase, references, lock)
        type: boolean
        default: false
permissions: {}
concurrency:
  group: runtime-adopt
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The open adoption issue records the backoff state.
      issues: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe Finney, testnet and upstream; decide this run's action
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE: ${{ inputs.simulate }}
          RTAO_ADOPT_FORCE: ${{ inputs.force }}
          RTAO_ADOPT_CORE_BUMP: ${{ inputs.core_bump }}
        run: |
          out="$RUNNER_TEMP/decision"
          mkdir -p "$out"
          if [ -n "$SIMULATE" ]; then
            printf '%s\n' "$SIMULATE" | jq --argjson bump "${RTAO_ADOPT_CORE_BUMP:-false}" \
              '.core_bump = (.core_bump // $bump)' > "$out/observed.json"
          else
            timeout 300s ci/runtime-adopt.sh observe "$out/observed.json"
          fi
          ci/runtime-adopt.sh decide "$out/observed.json" "$out/decision.json"
          # A run queued behind another decides on its own (older) checkout:
          # when the ref's present pins no longer call for this action, skip
          # it rather than adopt and report what main already carries (D-168).
          if [ -z "$SIMULATE" ]; then
            current=$(ci/runtime-adopt.sh current "$out/decision.json" "$out/observed.json")
            case "$current" in
              superseded:*)
                jq --arg reason "$current" '.wanted = .action | .action = "superseded" | .reason = $reason' \
                  "$out/decision.json" > "$out/decision.superseded.json"
                mv "$out/decision.superseded.json" "$out/decision.json"
                ;;
            esac
          fi
          echo "action=$(jq -r .action "$out/decision.json")" >> "$GITHUB_OUTPUT"
          jq . "$out/decision.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-adopt-decision
          path: ${{ runner.temp }}/decision
          if-no-files-found: error
          retention-days: 30

  adopt:
    needs: decide
    if: needs.decide.outputs.action == 'adopt-finney' || needs.decide.outputs.action == 'record-testnet' || needs.decide.outputs.action == 'core-bump'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Read-only: this job compiles and runs code, so its token cannot push.
    # The validated commit leaves it as a bundle; the push job builds nothing.
    permissions:
      contents: read
    # Job-level env cannot read the runner context (GitHub refuses to parse
    # the whole workflow), so the paths under the runner's temp directory are
    # set by the first step.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/runtime-adopt
    steps:
      - name: Paths under the runner's temp directory
        run: |
          {
            echo "RTAO_TEMP_ROOT=$RUNNER_TEMP/runtime-adopt"
            echo "RTAO_TEST_TMPDIR=$RUNNER_TEMP/runtime-adopt/tests"
            echo "DECISION=$RUNNER_TEMP/decision/decision.json"
            echo "EVIDENCE=$RUNNER_TEMP/evidence"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false
          build-warnings: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: . -> target/runtime-adopt
      - name: Install the independent metadata diff tool (drift's second opinion)
        run: |
          cargo install subxt-cli --version 0.51.1 --locked --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-adopt-decision
          path: ${{ runner.temp }}/decision
      - name: Pin, import, regenerate and check in a disposable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 022
          mkdir -p "$RTAO_TEMP_ROOT" "$RTAO_TEST_TMPDIR" "$EVIDENCE"
          set -o pipefail
          ci/runtime-adopt.sh adopt "$DECISION" "$RTAO_TEMP_ROOT/candidate" "$EVIDENCE" 2>&1 | tee "$EVIDENCE/log.txt"
      - name: Commit the candidate as a bundle
        run: |
          set -o pipefail
          ci/runtime-adopt.sh commit "$DECISION" "$RTAO_TEMP_ROOT/candidate" "$EVIDENCE/adopt.bundle" 2>&1 | tee -a "$EVIDENCE/log.txt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-adopt-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

  push:
    needs: [decide, adopt]
    if: needs.adopt.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      superseded: ${{ steps.push.outputs.superseded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push step pushes main and the snapshot tag with this token.
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-adopt-decision
          path: ${{ runner.temp }}/decision
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-adopt-evidence
          path: ${{ runner.temp }}/evidence
      - name: Push main and the snapshot tag
        id: push
        env:
          RTAO_ADOPT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.simulate != '') && '1' || '' }}
        run: |
          set -o pipefail
          ci/runtime-adopt.sh push "$RUNNER_TEMP/decision/decision.json" "$RUNNER_TEMP/evidence/adopt.bundle" | tee "$RUNNER_TEMP/push.txt"
          if grep -q '^superseded:' "$RUNNER_TEMP/push.txt"; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

  forks-plan:
    needs: [decide, push]
    if: always() && needs.decide.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Read-only: this job compiles (the verifying package build and xtask).
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
      commit: ${{ steps.pending.outputs.commit }}
    steps:
      - name: Paths under the runner's temp directory
        run: |
          {
            echo "RTAO_TEMP_ROOT=$RUNNER_TEMP/forks"
            echo "FORKS=$RUNNER_TEMP/forks-plan"
          } >> "$GITHUB_ENV"
      # main as it is now, including what this run's push job landed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: List the republished packages without a recorded checksum
        id: pending
        run: |
          set -o pipefail
          mkdir -p "$FORKS"
          ci/runtime-adopt.sh forks-pending upstream.toml | tee "$FORKS/pending.json"
          echo "pending=$(jq 'length > 0' "$FORKS/pending.json")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: steps.pending.outputs.pending == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: ""
      - if: steps.pending.outputs.pending == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Check, package and verify the republished packages
        if: steps.pending.outputs.pending == 'true'
        run: |
          umask 022
          mkdir -p "$RTAO_TEMP_ROOT"
          set -o pipefail
          ci/runtime-adopt.sh forks-package "$FORKS" 2>&1 | tee "$FORKS/package.log"
      - if: always() && steps.pending.outputs.pending == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-adopt-forks-plan
          path: ${{ runner.temp }}/forks-plan
          if-no-files-found: warn
          retention-days: 30

  forks-publish:
    needs: forks-plan
    # !cancelled(): without a status function the implicit success() also
    # requires forks-plan's own dependencies (adopt, push) to have succeeded,
    # so a run that adopted nothing would skip publication.
    if: >-
      !cancelled()
      && needs.forks-plan.result == 'success' && needs.forks-plan.outputs.pending == 'true'
      && github.ref == 'refs/heads/main'
      && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.simulate != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Holds the crates.io token and builds nothing: archives are packaged
    # without building and uploaded only when their SHA256 is the verified one.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.forks-plan.outputs.commit }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: ""
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-adopt-forks-plan
          path: ${{ runner.temp }}/forks-plan
      - name: Publish the changed rtao-upstream-* packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/forks-published"
          set -o pipefail
          ci/runtime-adopt.sh forks-publish "$RUNNER_TEMP/forks-plan/plan.json" "$RUNNER_TEMP/forks-published/published.json" 2>&1 |
            tee "$RUNNER_TEMP/forks-published/publish.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-adopt-forks-published
          path: ${{ runner.temp }}/forks-published
          if-no-files-found: warn
          retention-days: 30

  forks-record:
    needs: [forks-plan, forks-publish]
    if: "!cancelled() && needs.forks-publish.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only: builds xtask for forks verify-published; the record leaves
    # as a bundle that the push job checks and pushes.
    permissions:
      contents: read
    env:
      # The record candidate is a worktree under the runner's temp directory;
      # its xtask builds share the checkout's cached target directory.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Paths under the runner's temp directory
        run: |
          {
            echo "RTAO_TEMP_ROOT=$RUNNER_TEMP/forks"
            echo "EVIDENCE=$RUNNER_TEMP/forks-record"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.forks-plan.outputs.commit }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          build-warnings: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-adopt-forks-plan
          path: ${{ runner.temp }}/forks-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-adopt-forks-published
          path: ${{ runner.temp }}/forks-published
      - name: Verify the published archives and commit their checksums as a bundle
        run: |
          umask 022
          mkdir -p "$RTAO_TEMP_ROOT" "$EVIDENCE"
          set -o pipefail
          ci/runtime-adopt.sh forks-record "$RUNNER_TEMP/forks-plan/plan.json" "$RUNNER_TEMP/forks-published/published.json" \
            "$RTAO_TEMP_ROOT/record" "$EVIDENCE" 2>&1 | tee "$EVIDENCE/record.log"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-adopt-forks-record
          path: ${{ runner.temp }}/forks-record
          if-no-files-found: warn
          retention-days: 30

  forks-push:
    needs: forks-record
    if: "!cancelled() && needs.forks-record.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      superseded: ${{ steps.push.outputs.superseded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push step pushes main with this token.
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-adopt-forks-record
          path: ${{ runner.temp }}/forks-record
      - name: Push the checksum record to main
        id: push
        run: |
          set -o pipefail
          ci/runtime-adopt.sh push "$RUNNER_TEMP/forks-record/forks-decision.json" "$RUNNER_TEMP/forks-record/forks.bundle" |
            tee "$RUNNER_TEMP/forks-push.txt"
          if grep -q '^superseded:' "$RUNNER_TEMP/forks-push.txt"; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: [decide, adopt, push, forks-plan, forks-publish, forks-record, forks-push]
    if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.simulate != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: runtime-adopt-decision
          path: ${{ runner.temp }}/decision
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.adopt.result != 'skipped'
        continue-on-error: true
        with:
          name: runtime-adopt-evidence
          path: ${{ runner.temp }}/evidence
      - name: Issue and alert
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ALERT_URL: ${{ secrets.RUNTIME_ALERT_URL }}
          RUNTIME_ALERT_TOKEN: ${{ secrets.RUNTIME_ALERT_TOKEN }}
          DECIDED: ${{ needs.decide.result }}
          ACTION: ${{ needs.decide.outputs.action }}
          ADOPTED: ${{ needs.adopt.result }}
          PUSHED: ${{ needs.push.result }}
          SUPERSEDED: ${{ needs.push.outputs.superseded }}
        run: |
          decision="$RUNNER_TEMP/decision/decision.json"
          if [ "$DECIDED" != success ] || [ ! -f "$decision" ]; then
            # The decision itself failed: report it under a fixed id.
            jq -n --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{action: "blocked", network: "upstream", spec: null, code: null, id: "decide",
                reason: "the runtime-adopt decision step failed (observation or pins); see \($run)",
                upcoming: []}' > "$RUNNER_TEMP/decide-failed.json"
            ci/runtime-adopt.sh notify "$RUNNER_TEMP/decide-failed.json" failure
            exit 0
          fi
          case "$ACTION:$ADOPTED:$PUSHED" in
            none:*) outcome=none ;;
            backoff:*) outcome=backoff ;;
            superseded:*) outcome=superseded ;;
            blocked:*) outcome=failure ;;
            *:success:success) outcome=success ;;
            *) outcome=failure ;;
          esac
          if [ "$SUPERSEDED" = true ]; then outcome=superseded; fi
          # A failure decided on a checkout that main has since moved past
          # (an adoption that landed meanwhile) is not reported (D-168).
          if [ "$outcome" = failure ] && [ -f "$RUNNER_TEMP/decision/observed.json" ]; then
            current=$(ci/runtime-adopt.sh current "$decision" "$RUNNER_TEMP/decision/observed.json")
            case "$current" in
              superseded:*) echo "$current"; outcome=superseded ;;
            esac
          fi
          ci/runtime-adopt.sh notify "$decision" "$outcome" "$RUNNER_TEMP/evidence"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always() && needs.forks-plan.outputs.pending == 'true'
        continue-on-error: true
        with:
          pattern: runtime-adopt-forks-*
          path: ${{ runner.temp }}/forks
          merge-multiple: true
      - name: Republished packages - issue, alert and release proposal
        if: always() && needs.forks-plan.result != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_ALERT_URL: ${{ secrets.RUNTIME_ALERT_URL }}
          RUNTIME_ALERT_TOKEN: ${{ secrets.RUNTIME_ALERT_TOKEN }}
          PLANNED: ${{ needs.forks-plan.result }}
          PENDING: ${{ needs.forks-plan.outputs.pending }}
          PUBLISHED: ${{ needs.forks-publish.result }}
          RECORDED: ${{ needs.forks-record.result }}
          RECORD_PUSHED: ${{ needs.forks-push.result }}
          RECORD_SUPERSEDED: ${{ needs.forks-push.outputs.superseded }}
        run: |
          stage=none
          case "$PLANNED:$PENDING:$PUBLISHED:$RECORDED:$RECORD_PUSHED" in
            success:false:*) outcome=none ;;
            success:true:skipped:*)
              if [ "$GITHUB_REF" != refs/heads/main ]; then echo "publication skipped (not main)"; exit 0; fi
              # On main and not a dry run (this job does not run for one),
              # a skipped publication is a failure, never a quiet pass.
              outcome=failure stage=publish
              ;;
            success:true:success:success:success) outcome=success ;;
            success:true:success:success:*) outcome=failure stage=push ;;
            success:true:success:*) outcome=failure stage=verify ;;
            success:true:*) outcome=failure stage=publish ;;
            *) outcome=failure stage=package ;;
          esac
          if [ "$RECORD_SUPERSEDED" = true ]; then outcome=superseded; fi
          ci/runtime-adopt.sh forks-notify "$outcome" "$stage" "$RUNNER_TEMP/forks"
