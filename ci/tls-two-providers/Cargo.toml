# Hosted-only feature-unification regression; never a shipped workspace member.
[workspace]
resolver = "3"

[package]
name = "rtao-tls-two-providers"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"
autotests = false

[dependencies]
rtao-rpc = { path = "../../crates/rtao-rpc", default-features = false }
rtao-testkit = { path = "../../crates/rtao-testkit", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
url = "2"

[[test]]
name = "two_providers"
path = "tests/two_providers.rs"

[patch.crates-io]
w3f-bls = { git = "https://github.com/RaoFoundation/subtensor.git", tag = "v478" }
ruint = { path = "../../patches/ruint" }

[patch."https://github.com/RaoFoundation/subtensor.git"]
bittensor-core = { git = "https://github.com/sam0x17/subtensor.git", rev = "eafe84e8a97376e7902118ebb204b9c53e3df55e" }

[patch."https://github.com/sam0x17/subtensor.git"]
w3f-bls = { git = "https://github.com/RaoFoundation/subtensor.git", tag = "v478" }
subtensor-macros = { git = "https://github.com/RaoFoundation/subtensor.git", tag = "v478" }
