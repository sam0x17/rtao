# Hosted-only feature-unification regression; never a shipped workspace member.
[workspace]
resolver = "3"

[package]
name = "rtao-tls-two-providers"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"
autotests = false

[dependencies]
rtao-jsonrpc = { path = "../../crates/rtao-jsonrpc", default-features = false }
rtao-testkit = { path = "../../crates/rtao-testkit", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
url = "2"

[[test]]
name = "two_providers"
path = "tests/two_providers.rs"
